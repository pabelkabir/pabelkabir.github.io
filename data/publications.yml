# Curated fields supplementing publications_seed.bib.
# Codex should merge by citekey and never overwrite these fields silently.

- citekey: datta2025stimulus
  type: journal-article
  featured: true
  research_area: photophysics
  summary: >-
    Combines molecular design, spectroscopy, and excited-state calculations to explain how
    9-fluorenone derivatives access fluorescence, charge-transfer emission, phosphorescence,
    and delayed fluorescence under different molecular and environmental conditions.

- citekey: kabir2024electronic
  type: journal-article
  featured: true
  research_area: photophysics
  open_access: true
  preprint: https://doi.org/10.26434/chemrxiv-2024-57gzq
  summary: >-
    Benchmarks multireference, TD-DFT, coupled-cluster-related, and other wave-function methods
    for flavin excited states, clarifying which computational choices are reliable for different
    spectroscopic and photophysical questions.

- citekey: kabir2023alternative
  type: journal-article
  featured: true
  research_area: photophysics
  open_access: true
  preprint: https://doi.org/10.26434/chemrxiv-2022-kqmfc
  code: https://github.com/pabelkabir/QM-MM-Protocol-for-Flavoproteins
  summary: >-
    Uses electrostatic spectral-tuning maps, molecular dynamics, QM/MM calculations, mutagenesis,
    and spectroscopy to test a rational strategy for shifting the fluorescence of a flavin-binding
    fluorescent protein.

- citekey: kabir2021hydrogen
  type: journal-article
  featured: false
  research_area: photophysics
  summary: >-
    Connects hydrogen-bonding environments with changes in flavin infrared absorption and
    vibrational assignments.

- citekey: kabir2019electronic
