project:
  type: website
  output-dir: ../docs
  render:
    - index.qmd
    - research/index.qmd
    - research/photophysics/index.qmd
    - research/multiscale-workflows/index.qmd
    - research/interactions-materials/index.qmd
    - publications/index.qmd
    - people/index.qmd
    - software/index.qmd
    - molecule-viewer/index.qmd
    - join/index.qmd
    - contact/index.qmd
    - 404.qmd
  resources:
    - CNAME
    - .nojekyll
    - contact.html
    - research/photophysics.html
    - research/multiscale-workflows.html
    - research/interactions-materials.html
    - assets/**
    - generated/publications.json
    - qmmm-platform/**

website:
  title: "Kabir Lab"
  site-url: "https://kabirlab.org"
  description: "Kabir Computational Molecular Science Lab at Savannah State University."
  favicon: assets/brand/favicon.png
  navbar:
    title: "Kabir Lab"
    logo: assets/brand/kabir-lab-logo.png
    logo-alt: "Kabir Lab logo"
    collapse-below: xl
    left:
      - text: Home
        href: index.qmd
      - text: Research
        href: research/index.qmd
      - text: Publications
        href: publications/index.qmd
      - text: People
        href: people/index.qmd
      - text: Resources
        href: software/index.qmd
      - text: Molecule Viewer
        href: molecule-viewer/index.qmd
      - text: QM/MM Platform
        href: qmmm-platform/index.html
      - text: Join
        href: join/index.qmd
      - text: Contact
        href: contact/index.qmd
  page-footer:
    left: |
      <span class="lab-footer-brand">
        <img src="/assets/brand/kabir-lab-logo.png" alt="Kabir Lab logo">
        <span class="lab-footer-brand-copy">
          <strong>Kabir Lab</strong>
          <span>Department of Chemistry and Forensic Science<br>Savannah State University</span>
        </span>
      </span>
    center: |
      <div class="lab-footer-contact">
        <a href="mailto:kabirm@savannahstate.edu"><i class="bi bi-envelope" aria-hidden="true"></i><span>kabirm@savannahstate.edu</span></a>
        <span class="lab-footer-divider" aria-hidden="true"></span>
        <span><i class="bi bi-geo-alt" aria-hidden="true"></i>Savannah, Georgia, USA</span>
      </div>
    right: |
      <a class="lab-footer-ssu" href="https://www.savannahstate.edu/" aria-label="Savannah State University">
        <strong>SSU</strong>
        <span>Savannah State<br>University</span>
      </a>
  search: false

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: false
    anchor-sections: true
    smooth-scroll: true
    include-in-header:
      text: |
        <meta property="og:image" content="https://kabirlab.org/assets/hero-molecular-map.png">
        <meta name="twitter:card" content="summary_large_image">
execute:
  freeze: auto
